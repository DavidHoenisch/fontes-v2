, even</tspan><tspan x="54" y="334">so must the Son of man be lifted</tspan><tspan x="54" y="362">up:</tspan></text><text font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#828E83" text-anchor="start"><tspan x="24" y="410.0">15</tspan></text><text font-family="Lora" font-size="20" font-weight="400" fill="#ECEDE5" text-anchor="start"><tspan x="54" y="414">That whosoever believeth in</tspan><tspan x="54" y="442">him should not perish, but have</tspan><tspan x="54" y="470">eternal life.</tspan></text><rect x="16" y="498" width="358" height="156" rx="10" fill="#38372B" opacity="1"/><text font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#DCBC83" text-anchor="start"><tspan x="24" y="518.0">16</tspan></text><text font-family="Lora" font-size="20" font-weight="400" fill="#ECEDE5" text-anchor="start"><tspan x="54" y="522">For God so loved the world, that</tspan><tspan x="54" y="550">he gave his only begotten Son,</tspan><tspan x="54" y="578">that whosoever believeth in him</tspan><tspan x="54" y="606">should not perish, but have</tspan><tspan x="54" y="634">everlasting life.</tspan></text></svg>