y="1" stroke="#3C443E"/><text font-family="Lora" font-size="20" font-weight="400" fill="#ECEDE5" text-anchor="start"><tspan x="44" y="178">“For God so loved the world,</tspan><tspan x="44" y="208">that he gave his only begotten</tspan><tspan x="44" y="238">Son…”</tspan></text><text font-family="IBM Plex Sans" font-size="12" font-weight="500" fill="#ABB3AA" text-anchor="start"><tspan x="24" y="330.0">HIGHLIGHT</tspan></text><rect x="24" y="350" width="48" height="48" rx="10" fill="#DCBC83" opacity="1"/><g id="phosphor-check" transform="translate(36 362) scale(0.09375)" fill="#1C211B"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></g><rect x="84" y="350" width="48" height="48" rx="10" fill="#B2C5AB" opacity="1"/><rect x="144" y="350" width="48" height="48" rx="10" fill="#9EBAC8" opacity="1"/><rect x="204" y="350" width="48" height="48" rx="10" fill="#C6A5A0" opacity="1"/><rect x="24" y="426" width="342" height="250" rx="12" fill="#2C322E" opacity="1" stroke="#3C443E"/><text font-family="IBM Plex Sans" font-size="16" font-weight="500" fill="#ECEDE5" text-anchor="start"><tspan x="44" y="462.0">Love takes the initiative</tspan></text><text font-family="IBM Plex Sans" font-size="16" font-weight="400" fill="#ECEDE5" text-anchor="start"><tspan x="44" y="502">The movement begins with God’s love</tspan><tspan x="44" y="528">and becomes visible in the giving of his</tspan><tspan x="44" y="554">Son. Compare with 1 John 4:9.</tspan></text><text font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#ABB3AA" text-anchor="start"><tspan x="44" y="650.0">Private on this device</tspan></text><text font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#ABB3AA" text-anchor="start"><tspan x="24" y="710.0">Follows the passage across translations.</tspan></text><rect x="24" y="752" width="104" height="48" rx="10" fill="#2C322E" opacity="1" stroke="#3C443E"/><text font-family="IBM Plex Sans" font-size="16" font-weight="500" fill="#ECEDE5" text-anchor="middle"><tspan x="76.0" y="782.0">Cancel</tspan></text><rect x="140" y="752" width="226" height="48" rx="10" fill="#DCBC83" opacity="1"/><text font-family="IBM Plex Sans" font-size="16" font-weight="500" fill="#1C211B" text-anchor="middle"><tspan x="253.0" y="782.0">Save note</tspan></text><rect x="145" y="826" width="100" height="4" rx="2" fill="#828E83" opacity="1"/></svg>