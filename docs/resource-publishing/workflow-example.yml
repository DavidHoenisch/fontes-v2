# Documentation template: replace PINNED_TOOLING_COMMIT with a reviewed 40-hex SHA.
name: Private resource source releases
on:
  push:
    branches: [main]
    paths: ['library/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: DavidHoenisch/fontes-v2/.github/workflows/resource-pipeline.yml@PINNED_TOOLING_COMMIT
    with:
      tooling_repository: DavidHoenisch/fontes-v2
      tooling_ref: PINNED_TOOLING_COMMIT
      policy_repository: ${{ github.repository }}
      policy_ref: ${{ github.sha }}
      source_ref: ${{ github.sha }}
      approved_only: true
  publish:
    needs: build
    if: needs.build.outputs.ready_count != '0'
    permissions:
      contents: write
    uses: DavidHoenisch/fontes-v2/.github/workflows/resource-publish.yml@PINNED_TOOLING_COMMIT
    with:
      policy_repository: ${{ github.repository }}
      policy_ref: ${{ needs.build.outputs.policy_sha }}
    secrets:
      signing_key: ${{ secrets.FONTES_RESOURCE_SIGNING_KEY }}
