# Portable caller pinned to the reviewed source-publishing tooling revision.
name: Private resource source releases
on:
  push:
    branches: [main]
    paths: ['library/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: DavidHoenisch/fontes-v2/.github/workflows/resource-pipeline.yml@884b90baa0280afa7a8159c1c9ee7b180eb35239
    with:
      tooling_repository: DavidHoenisch/fontes-v2
      tooling_ref: 884b90baa0280afa7a8159c1c9ee7b180eb35239
      policy_repository: ${{ github.repository }}
      policy_ref: ${{ github.sha }}
      source_ref: ${{ github.sha }}
      approved_only: true
  publish:
    needs: build
    if: needs.build.outputs.ready_count != '0'
    permissions:
      contents: write
    uses: DavidHoenisch/fontes-v2/.github/workflows/resource-publish.yml@884b90baa0280afa7a8159c1c9ee7b180eb35239
    with:
      policy_repository: ${{ github.repository }}
      policy_ref: ${{ needs.build.outputs.policy_sha }}
    secrets:
      signing_key: ${{ secrets.FONTES_RESOURCE_SIGNING_KEY }}
