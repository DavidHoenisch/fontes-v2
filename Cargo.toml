[workspace]
members = ["crates/fontes-data-contracts", "crates/fontes-data-pipeline", "crates/fontes-resource", "crates/fontes-engine", "crates/ui-egui", "apps/fontes", "apps/fontes-cli", "apps/fontes-android"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
eframe = { version = "=0.35.0", default-features = false, features = ["wgpu", "x11", "wayland"] }
