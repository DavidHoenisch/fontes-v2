name: Reusable resource source publisher

on:
  workflow_call:
    inputs:
      policy_repository:
        type: string
        required: true
      policy_ref:
        description: Exact trusted policy SHA returned by the build.
        type: string
        required: true
      policy_path:
        type: string
        default: library
      release_repository:
        type: string
        default: ''
      publication_environment:
        type: string
        default: resource-source-releases
    secrets:
      signing_key:
        required: true
      source_read_token:
        required: false
      publication_token:
        required: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.publication_environment }}
    concurrency:
      group: resource-source-publication-${{ inputs.release_repository || github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the exact trusted policy used by the build
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.policy_repository }}
          ref: ${{ inputs.policy_ref }}
          token: ${{ secrets.source_read_token || github.token }}
          persist-credentials: false
      - name: Download only this run's trusted build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: resource-publication
          path: checked
      - name: Sign, publish, and verify draft and public assets
        env:
          GH_TOKEN: ${{ secrets.publication_token || github.token }}
          FONTES_RESOURCE_SIGNING_KEY: ${{ secrets.signing_key }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository || github.repository }}
          POLICY_PATH: ${{ inputs.policy_path }}
        run: |
          chmod +x checked/resource-publisher/fontes-resource
          checked/resource-publisher/fontes-resource submissions publish \
            --dir checked/resource-build --policy-root "$POLICY_PATH" --repository "$RELEASE_REPOSITORY"
