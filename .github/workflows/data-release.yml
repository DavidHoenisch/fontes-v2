name: Free resources data release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/data-release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/fontes-data-contracts/**'
      - 'crates/fontes-data-pipeline/**'
      - 'tools/sword-export.cpp'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fontes-data-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Install SWORD build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsword-dev pkg-config libxml2-utils
          test "$(pkg-config --modversion sword)" = 1.9.0
          mkdir -p target
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Wno-unused-parameter $(pkg-config --cflags sword) tools/sword-export.cpp $(pkg-config --libs sword) -o target/fontes-sword-export
          target/fontes-sword-export --version
      - name: Check formatting and tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p fontes-data-contracts -p fontes-data-pipeline -p fontes-resource
          cargo clippy --locked -p fontes-data-contracts -p fontes-data-pipeline -p fontes-resource --all-targets -- -D warnings
      - name: Compile the pipeline
        run: cargo build --release --locked -p fontes-data-pipeline
      - name: Compile the complete default free-resource package
        env:
          FONTES_BUILDER_COMMIT: ${{ github.sha }}
          FONTES_REPOSITORY: ${{ github.repository }}
        run: |
          target/release/fontes-data build --profile study --output dist/free-resources --builder-commit "$FONTES_BUILDER_COMMIT" --mirror-repository "$FONTES_REPOSITORY"
      - name: Prove reproducibility from the verified offline cache
        env:
          FONTES_BUILDER_COMMIT: ${{ github.sha }}
        run: |
          target/release/fontes-data build --profile study --output dist/repro-free-resources --builder-commit "$FONTES_BUILDER_COMMIT" --offline
          cmp dist/free-resources/library.sqlite dist/repro-free-resources/library.sqlite
          cmp dist/free-resources/fontes-study.sqlite.zst dist/repro-free-resources/fontes-study.sqlite.zst
          cmp dist/free-resources/validation-report.json dist/repro-free-resources/validation-report.json
          cmp dist/free-resources/study-imports.json dist/repro-free-resources/study-imports.json
      - name: Retain checked outputs for the publisher
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: content-build
          path: |
            target/release/fontes-data
            dist/free-resources/*.sqlite
            dist/free-resources/*.zst
            dist/free-resources/*.json
            dist/free-resources/*.txt
            dist/free-resources/KJV-ANNOTATIONS-NOTICE.md
            dist/free-resources/source-*.zip
            dist/free-resources/source-*.xml
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: content-build
          path: checked-build
      - name: Sign, create draft, verify assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          FONTES_DATA_SIGNING_KEY: ${{ secrets.FONTES_DATA_SIGNING_KEY }}
          FONTES_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x checked-build/target/release/fontes-data
          checked-build/target/release/fontes-data publish --dir checked-build/dist/free-resources --trust data/trust/data-release-1.json --repository "$FONTES_REPOSITORY"
